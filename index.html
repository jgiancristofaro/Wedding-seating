<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Plan your wedding seating visually: import guests, lay out tables, drag guests to seats and share a link."
    />
    <meta name="theme-color" content="#FAF7F2" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Seating Plan · Wedding seating chart</title>
    <script>
      try {
        var t = localStorage.getItem('ws.theme');
        if (t === 'dark') document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This app needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
